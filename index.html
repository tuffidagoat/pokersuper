<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2818"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Poker Chip"><title>Poker Chip</title>
<style>
:root{--bg:#0d1512;--s:#16221c;--line:#273a30;--text:#e9efe9;--mute:#8a9a90;--gold:#d9b45b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:540px;margin:0 auto;padding:12px}
h1{font-size:1.6rem;letter-spacing:-.02em;margin:.3em 0}
.mute{color:var(--mute);font-size:.82rem}
.card{background:var(--s);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
input{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:inherit;width:100%}
label{display:block;font-size:.82rem;color:var(--mute);margin-top:10px}
.row{display:flex;gap:8px;margin:6px 0;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:10px;padding:13px 8px;font-weight:600;color:#fff;flex:1;min-width:0}
.btn:disabled,.sm:disabled{opacity:.35}
.fold{background:#7a2f2a}.call{background:#2b6b4c}.all{background:#4c3f86}.raise{background:var(--gold);color:#1b1608}
.go{background:var(--gold);color:#1b1608;width:100%;margin-top:10px}
.alt{background:transparent;border:1px solid var(--line);color:var(--text)}
.sm{border:1px solid var(--line);background:transparent;color:inherit;border-radius:8px;padding:6px 10px;font-size:.85rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ctl{display:flex;gap:6px}
.tbl{position:relative;width:100%;aspect-ratio:4/5;margin:6px 0}
.felt{position:absolute;inset:11% 8%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#1d6a4b,#124230);border:9px solid #2a2017;box-shadow:inset 0 0 40px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;padding:0 12%}
.felt .mute{color:rgba(255,255,255,.65)}
.pot{font-size:2rem;font-weight:700;line-height:1}
.board{display:flex;gap:4px;margin:6px 0}
.slot{width:26px;height:36px;border-radius:4px;border:1.5px dashed rgba(255,255,255,.3)}
.slot.on{background:#f3efe2;border:0}
.hint{font-size:.72rem;color:rgba(255,255,255,.7)}
.seat{position:absolute;transform:translate(-50%,-50%);width:76px;text-align:center;background:var(--s);border:1.5px solid var(--line);border-radius:12px;padding:5px 3px;font-size:.76rem;line-height:1.25}
.seat b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .stk{font-weight:700;font-size:.95rem}
.seat.me{border-color:#6fae8f}.seat.act{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,180,91,.3)}.seat.dead{opacity:.4}
.d{position:absolute;top:-8px;right:-6px;width:20px;height:20px;border-radius:50%;background:#f3efe2;color:#222;font-weight:700;font-size:.7rem;display:grid;place-items:center}
.bet{position:absolute;transform:translate(-50%,-50%);background:var(--gold);color:#1b1608;font-weight:700;border-radius:999px;padding:1px 8px;font-size:.75rem}
.wait{text-align:center;color:var(--mute);margin:8px 0}
.btns{display:flex;gap:8px;margin:10px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{width:46px;height:46px;border-radius:50%;border:3px dashed rgba(255,255,255,.7);font-weight:700;font-size:.8rem;color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.c5{background:#eee;color:#222;border-color:#999}.c10{background:#c64040}.c25{background:#2e9e5b}.c100{background:#222}.c500{background:#7b4bc4}
.pick{border:1.5px solid var(--line);background:transparent;color:inherit;border-radius:10px;padding:9px 13px;font-weight:600;margin:4px 4px 0 0}
.pick.on{background:var(--gold);color:#1b1608;border-color:var(--gold)}
.err{color:#ff8a80;font-weight:600;margin:8px 0}
.code{font-size:3rem;font-weight:700;letter-spacing:.2em;text-align:center}
.st{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.8);overflow:auto;padding:16px;z-index:9}
#ov[hidden]{display:none}
.rk{max-width:480px;margin:0 auto;background:var(--s);border:1px solid var(--line);border-radius:14px;padding:14px}
.rkrow{padding:9px 0;border-bottom:1px solid var(--line)}
.mc{display:inline-block;width:32px;height:44px;margin:4px 3px 0 0;border-radius:5px;background:#f3efe2;color:#1a1a1a;font-weight:700;font-size:.85rem;line-height:1.15;text-align:center;padding-top:6px}
.mc.red{color:#c0392b}.mc.kick{opacity:.4}

/* ---- v2.1: online-poker-room look ---- */
:root{--bg:#120a0a;--s:#1d1313;--line:#3a2a2a;--mute:#a08f8f}
.wrap.g{max-width:940px}
body{background:radial-gradient(ellipse at 50% 30%,#2a1414,#0e0707 70%) fixed}
.tbl{aspect-ratio:16/10;max-width:900px;margin:10px auto 6px}
.felt{inset:12% 6%;border-radius:999px;border:14px solid #262626;background:radial-gradient(ellipse at 50% 35%,#a12c30,#5b1417 80%);box-shadow:0 0 0 3px #4a4a4a,0 14px 34px rgba(0,0,0,.65),inset 0 0 70px rgba(0,0,0,.55);padding:0 14%;gap:6px}
.felt::before{content:"";position:absolute;inset:9%;border:1px solid rgba(255,255,255,.14);border-radius:999px;pointer-events:none}
.felt::after{content:"POKER Table";position:absolute;bottom:20%;color:rgba(255,255,255,.07);font:700 1.6rem Georgia,serif;letter-spacing:.1em;pointer-events:none}
.pt{font-size:.85rem;color:#f3e3e3}.pt b{font-size:1.2rem}
.board{display:flex;gap:6px;margin:2px 0}
.slot{width:34px;height:48px;border-radius:5px;border:1.5px dashed rgba(255,255,255,.28);background:rgba(0,0,0,.12)}
.slot.on{background:#f4efe6;border:0;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.seat{width:92px;background:none;border:0;padding:0;border-radius:0;box-shadow:none;display:flex;flex-direction:column;align-items:center}
.av{position:relative;width:46px;height:46px}
.ph{position:absolute;inset:0;border-radius:50%;background:radial-gradient(#4a4a4a,#2a2a2a);border:2px solid #666;display:grid;place-items:center;color:#a8a8a8;font-weight:700;z-index:1}
.seat.me .ph{border-color:var(--gold)}
.seat.act .ph{border-color:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.35),0 0 16px #3ddc84}
.cb{position:absolute;top:-9px;width:17px;height:25px;border-radius:3px;border:1px solid #888;background:repeating-linear-gradient(45deg,#6b6b6b 0 3px,#3c3c3c 3px 6px)}
.cb:nth-child(1){left:3px;transform:rotate(-14deg)}.cb:nth-child(2){right:3px;transform:rotate(14deg)}
.plate{position:relative;z-index:2;margin-top:-9px;min-width:74px;padding:2px 8px;text-align:center;border:1px solid #5a5a5a;border-radius:8px;background:linear-gradient(#303030,#161616);font-size:.72rem;line-height:1.25}
.plate b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px;font-size:.74rem}
.plate span{color:#e8c96a;font-weight:700}
.plate small{display:block;color:var(--mute);font-size:.62rem}
.d{top:-2px;right:20px;z-index:3}
.bet{display:flex;align-items:center;gap:4px;background:none;color:#fff;padding:0;font-size:.74rem}
.bet::before{content:"";width:15px;height:15px;border-radius:50%;background:#f1f1f1;border:3px dashed #d33;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.bar .btn{flex:0 0 auto;min-width:92px;padding:14px 16px;font-size:1rem;background:linear-gradient(#3b2b2b,#1c1212);border:1px solid #5a4444}
.bar .fold{color:#ee5a55}.bar .call,.bar .all{color:#fff}.bar .raise{color:#5fd07a}
.sld{flex:1;min-width:190px;display:flex;align-items:center;gap:6px}
.sld input[type=range]{flex:1;padding:0;accent-color:#e0b45a}
.sld .sm{width:32px;padding:4px 0}.amt{min-width:54px;text-align:center;font-weight:700}
.panel{margin:10px 0}
.seat.me,.seat.act,.seat.dead{border:0;box-shadow:none}
@media(max-width:640px){
 .tbl{aspect-ratio:3/4}.felt{inset:9% 12%;border-width:10px;padding:0 6%}
 .seat{width:74px}.av{width:38px;height:38px}.cb{width:14px;height:21px}
 .plate{min-width:62px;padding:1px 5px}.plate b{max-width:64px;font-size:.68rem}
 .slot{width:26px;height:37px}.board{gap:4px}.felt::after{font-size:1.1rem}.d{right:14px}
 .bar .btn{flex:1;min-width:0;padding:13px 6px}.sld{order:5;flex:1 1 100%}.bar .raise{order:6;flex:1 1 100%}
}

#cp{position:fixed;inset:0;background:rgba(0,0,0,.82);overflow:auto;padding:12px;z-index:10}#cp[hidden]{display:none}
.cpg{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;margin:10px 0}
.cpc{padding:9px 0;border:1px solid var(--line);background:#f4efe6;color:#1a1a1a;border-radius:5px;font-weight:700;font-size:.72rem;line-height:1.1}
.cpc.red,.cf.red,.cb.up.red{color:#c0392b}.cpc.on{outline:3px solid var(--gold);background:#ffe9a8}.cpc:disabled{opacity:.18}
.cardrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 8px}.eq{font-weight:700}
.slot.cf{display:grid;place-items:center;font-weight:700;font-size:.8rem;line-height:1.05;color:#1a1a1a}.slot.cf.red{color:#c0392b}
.cb.up{width:22px;height:30px;top:-14px;background:#f4efe6;color:#1a1a1a;font-size:.65rem;font-weight:700;line-height:1;display:grid;place-items:center;border:1px solid #999}
.sld input.amt{width:82px;flex:none;padding:8px 4px;text-align:center}
.avatars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:8px 0 14px}.avatarpick{padding:2px;border:2px solid transparent;border-radius:50%;background:transparent;aspect-ratio:1;overflow:hidden}.avatarpick img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}.avatarpick.chosen{border-color:var(--gold);box-shadow:0 0 0 2px #d9b45b55;transform:scale(1.06)}.seat .profilepic{width:100%;height:100%;object-fit:cover;border-radius:50%}.seat.me{cursor:pointer}.seat .cb.up{transition:transform .24s cubic-bezier(.2,.8,.2,1),top .24s,left .24s,right .24s;z-index:4}.seat.me.expanded .cb.up{transform:scale(1.65) translateY(-5px);z-index:6}.seat.me.expanded .cb.up:nth-child(1){left:-2px}.seat.me.expanded .cb.up:nth-child(2){right:-2px}
.info{text-align:center;color:var(--mute);font-size:.8rem;margin-top:4px}.rc{color:var(--text);letter-spacing:.14em}
</style></head>
<body><div class="wrap" id="app"></div><div id="ov" hidden onclick="if(event.target===this)ranks()"></div><div id="cp" hidden></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STR=['Pre-flop','Flop','Turn','River'],PRE={500:[5,10],1000:[10,20],2000:[20,40],5000:[50,100],10000:[100,200]};
let JOINURL='',S=null,ES=null,ses=null,view='home',rt=0,rk='',err='',NM='',JC='',C={chips:1000,sb:10,bb:20,min:15},wasMine=false,NMAV=1,expandedCards=false;
try{ses=JSON.parse(localStorage.getItem('pc'))}catch(e){}

const post=async(p,b)=>{try{const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:ses&&ses.code,pid:ses&&ses.pid,...b})});return await r.json()}catch(e){return{error:'Can’t reach the server.'}}};
let POLL=null,LAST='',esOK=false;
function apply(j){
 const off=j.now-Date.now(),k=JSON.stringify({...j,now:0});
 if(S)S.off=off;
 if(k===LAST)return;LAST=k;S=j;S.off=off;
 const m=S.cur===S.me&&S.street<4;if(m&&!wasMine&&navigator.vibrate)navigator.vibrate(250);wasMine=m;render();
}
async function tick(){
 if(!ses)return;
 try{
  const r=await fetch('/state?code='+ses.code+'&pid='+ses.pid,{cache:'no-store'});
  if(r.status===404){err='You were removed, or the room was closed.';leave();return}
  apply(await r.json());
 }catch(e){}
}
function connect(){
 if(POLL)clearTimeout(POLL);if(ES)ES.close();LAST='';esOK=false;
 try{ES=new EventSource('/events?code='+ses.code+'&pid='+ses.pid);ES.onmessage=e=>{esOK=true;apply(JSON.parse(e.data))}}catch(e){}
 const loop=()=>{tick();POLL=setTimeout(loop,esOK?4000:1000)};loop();
}
function save(r){if(r.error){err=r.error;return render()}ses={code:r.code,pid:r.pid};try{localStorage.setItem('pc',JSON.stringify(ses))}catch(e){}connect()}
function leave(){ses=null;S=null;view='home';try{localStorage.removeItem('pc')}catch(e){}if(POLL)clearTimeout(POLL);if(ES){ES.close();ES=null}render()}
const go=v=>{view=v;err='';render()};
const create=async()=>{
 if(!(C.chips>0)){err='Enter the starting chips.';return render()}
 if(!(C.sb>0)||!(C.bb>=C.sb)){err='Big blind must be at least the small blind.';return render()}
 save(await post('/create',{name:NM,avatar:NMAV,chips:C.chips,sb:C.sb,bb:C.bb,minutes:C.min}));
};
const join=async()=>save(await post('/join',{code:JC.trim(),name:NM,avatar:NMAV}));
const act=(type,x)=>post('/act',{type,...x}).then(r=>{if(r.error){err=r.error;render()}else tick()});
const endG=()=>{if(confirm('End the game for everyone?'))act('end')};
let BT=false;
const setChips=v=>{C.chips=v;[C.sb,C.bb]=PRE[v];BT=false;render()};
const customChips=v=>{C.chips=Math.max(0,parseInt(v)||0);if(!BT&&C.chips>0){C.sb=Math.max(1,Math.round(C.chips/100));C.bb=C.sb*2;$('#c_sb').value=C.sb;$('#c_bb').value=C.bb}document.querySelectorAll('.pick[data-v]').forEach(b=>b.classList.toggle('on',+b.dataset.v===C.chips))};
const clk=()=>{const s=Math.max(0,Math.floor((Date.now()+S.off-S.startAt)/1000)),hr=Math.floor(s/3600),m=Math.floor(s%3600/60);return (hr?hr+':'+String(m).padStart(2,'0'):m)+':'+String(s%60).padStart(2,'0')};

function render(){
 $('#app').classList.toggle('g',!!(S&&S.started&&!S.over));$('#app').innerHTML=!S?(view==='create'?createH():view==='join'?joinH():homeH()):!S.started?lobbyH():S.over?finalH():gameH();
}
const errH=()=>err?`<div class="err">${esc(err)}</div>`:'';
const nameH=()=>`<label>Your name<input value="${esc(NM)}" maxlength="14" oninput="NM=this.value"></label><label>Choose your avatar</label><div class="avatars">${Array.from({length:20},(_,i)=>i+1).map(i=>`<button type="button" class="avatarpick ${NMAV===i?'chosen':''}" onclick="NMAV=${i};render()"><img src="/avatars/avatar_${i}.png" alt="Avatar ${i}"></button>`).join('')}</div>`;

function homeH(){return `<h1>♠ Poker Chip</h1><p class="mute">Chips, bets and pots for your home game. Deal with real cards.</p>${errH()}
<button class="btn go" onclick="go('create')">Create game</button><button class="btn go alt" onclick="go('join')">Join game</button>
<button class="sm" style="margin-top:14px" onclick="ranks()">Hand rankings</button>`}
function createH(){return `<button class="sm" onclick="go('home')">← Back</button><h1>Create game</h1>${nameH()}
<label>Starting chips</label><div>${[500,1000,2000,5000,10000].map(v=>`<button class="pick ${C.chips===v?'on':''}" data-v="${v}" onclick="setChips(${v})">${v.toLocaleString()}</button>`).join('')}</div>
<label>Or type any amount<input type="number" inputmode="numeric" min="1" value="${C.chips}" oninput="customChips(this.value)"></label>
<div class="grid2"><label>Small blind<input type="number" inputmode="numeric" min="1" id="c_sb" value="${C.sb}" oninput="C.sb=+this.value;BT=true"></label><label>Big blind<input type="number" inputmode="numeric" min="1" id="c_bb" value="${C.bb}" oninput="C.bb=+this.value;BT=true"></label></div>
<p class="mute">Blinds follow the chips automatically until you type your own.</p>
${errH()}
<button class="btn go" onclick="create()">Create game</button>`}
function joinH(){return `<button class="sm" onclick="go('home')">← Back</button><h1>Join game</h1>
<label>Room code<input inputmode="numeric" maxlength="4" value="${esc(JC)}" oninput="JC=this.value"></label>${nameH()}${errH()}
<button class="btn go" onclick="join()">Join</button>`}
const kick=i=>{if(confirm('Remove '+S.players[i].name+' from the room?'))act('kick',{i})};
const ctl=(i,plus)=>`<span class="ctl"><button class="sm" ${i?'':'disabled'} onclick="act('move',{i:${i},d:-1})">↑</button><button class="sm" ${i<S.players.length-1?'':'disabled'} onclick="act('move',{i:${i},d:1})">↓</button>${plus?`<button class="sm" onclick="act('topup',{i:${i}})">+${S.cfg.chips}</button>`:''}${S.players[i].host?'':`<button class="sm" onclick="kick(${i})">✕</button>`}</span>`;
const SU={S:'♠',H:'♥',D:'♦',C:'♣'};
const RK=[['Royal flush','AD KD QD JD 10D',0],['Straight flush','JS 10S 9S 8S 7S',0],['Four of a kind','9H 9C 9D 9S KH',1],['Full house','AH AC AD 3S 3H',0],['Flush','KC 10C 8C 7C 5C',0],['Straight','10H 9C 8D 7S 6H',0],['Three of a kind','7H 7D 7C QS 3H',2],['Two pair','JH JC 5D 5S 7H',1],['Pair','AH AS KD JS 7H',3],['High card','KH 8C QD 2S 7H',4]];
$('#ov').innerHTML=`<div class="rk"><div class="top"><b>Hand rankings</b><button class="sm" onclick="ranks()">Close</button></div><div class="mute">Best to worst. Faded cards don’t count toward the hand.</div>${RK.map((r,k)=>`<div class="rkrow"><span class="mute">${k+1}</span> <b>${r[0]}</b><div>${r[1].split(' ').map((c,j,a)=>{const s=c.slice(-1);return `<span class="mc ${'HD'.includes(s)?'red':''} ${j>=a.length-r[2]?'kick':''}">${c.slice(0,-1)}<br>${SU[s]}</span>`}).join('')}</div></div>`).join('')}</div>`;
const ranks=()=>{$('#ov').hidden=!$('#ov').hidden};
function lobbyH(){return `<div class="top"><span class="mute">Room code</span><button class="sm" onclick="ranks()">Hand rankings</button></div><div class="code">${S.code}</div>
<p class="mute" style="text-align:center">Friends open <b>${JOINURL||location.host}</b>, tap Join game and enter this code.<br>${S.cfg.chips} chips each · blinds ${S.cfg.sb}/${S.cfg.bb}</p>
<div class="card"><b>Seats</b> <span class="mute">${S.isHost?'Order = clockwise around the table.':''}</span>${S.players.map((p,i)=>`<div class="st"><span>${p.host?'👑 ':''}${esc(p.name)}${i===S.me?' (you)':''}</span>${S.isHost?ctl(i):''}</div>`).join('')}</div>${errH()}
${S.isHost?`<button class="btn go" ${S.players.length<2?'disabled':''} onclick="act('start')">Start game</button>`:'<p class="mute">Waiting for the host to start…</p>'}`}

function bounds(){const p=S.players[S.cur];return{min:Math.min(S.currentBet+S.minRaise,p.bet+p.chips),max:p.bet+p.chips}}
const addChip=v=>{rt=Math.min(rt+v,bounds().max);err='';render()};
function quick(k){const p=S.players[S.cur],b=bounds(),tc=Math.max(S.currentBet-p.bet,0);
 const v=k==='min'?b.min:k==='half'?S.currentBet+Math.round((S.pot+tc)/2):S.currentBet+S.pot+tc;rt=Math.max(b.min,Math.min(v,b.max));err='';render()}
const setRt=v=>{rt=Math.max(0,parseInt(v)||0);render()};

function gameH(){
 const P=S.players,me=S.me,cur=S.cur,st=S.street,n=st===0?0:st===1?3:st===2?4:5,N=P.length;
 const B=S.board||[],R=innerWidth>640?[44,38,28,22]:[37,40,22,26];
 const hint=S.runout?'All-in — deal the rest of the board.':['Deal two cards to each player.','Burn one, deal the flop.','Burn one, deal the turn.','Burn one, deal the river.','Reveal your hands.',''][st];
 const pos=(i,rx,ry)=>{const t=Math.PI/2+2*Math.PI*((i-me+N)%N)/N;return `left:${(50+rx*Math.cos(t)).toFixed(1)}%;top:${(50+ry*Math.sin(t)).toFixed(1)}%`};
 let h=`<div class="top"><span><b>Hand ${S.hand}</b> <span class="mute">· ${st<4?STR[st]:st===4?'Showdown':'Done'}</span></span><span class="mute" id="clock">${clk()}</span><span class="ctl"><button class="sm" onclick="ranks()">Rankings</button>${S.isHost?'<button class="sm" onclick="endG()">End</button>':''}</span></div>
 <div class="info">Room <b class="rc">${S.code}</b> · blinds ${S.cfg.sb}/${S.cfg.bb}</div>
 <div class="tbl"><div class="felt"><div class="pt">Total pot: <b>${S.pot}</b></div><div class="board">${[0,1,2,3,4].map(i=>{const c=B[i];return c?`<span class="slot on cf ${'HD'.includes(c.slice(-1))?'red':''}">${c.slice(0,-1)}<br>${SU[c.slice(-1)]}</span>`:`<span class="slot ${i<n?'on':''}"></span>`}).join('')}</div><div class="hint">${hint}</div></div>`;
 h+=P.map((q,i)=>`<div class="seat ${i===cur&&st<4?'act':''} ${q.folded?'dead':''} ${i===me?'me':''} ${i===me&&expandedCards?'expanded':''}" style="${pos(i,R[0],R[1])}" ${i===me?'onclick=\"expandedCards=!expandedCards;render()\" title=\"Tap to enlarge your cards\"':''}>${i===S.dealer&&!q.out?'<span class=\"d\">D</span>':''}<div class=\"av\">${q.hole&&q.hole.length===2?q.hole.map(c=>`<i class=\"cb up ${'HD'.includes(c.slice(-1))?'red':''}\">${c.slice(0,-1)}<br>${SU[c.slice(-1)]}</i>`).join(''):!q.folded?'<i class=\"cb\"></i><i class=\"cb\"></i>':''}<div class=\"ph\">${q.avatar?`<img class=\"profilepic\" src=\"/avatars/avatar_${q.avatar}.png\" alt=\"\">`:esc(q.name.charAt(0).toUpperCase())}</div></div><div class=\"plate\"><b>${esc(q.name)}</b><span>${q.chips}</span><small>${q.out?'Out':q.folded?'Folded':q.allin?'All-in':i===S.sbI?'SB':i===S.bbI?'BB':'&nbsp;'}</small></div></div>${q.bet?`<span class=\"bet\" style=\"${pos(i,R[2],R[3])}\">${q.bet}</span>`:''}`).join('')+'</div>';
 if(st<5)h+=`<div class="cardrow"><button class="sm" onclick="openCP('hole')">${(P[me].hole||[]).length?'Edit my cards':'My cards'}</button><button class="sm" onclick="openCP('board')">${B.length?'Edit board':'Set board'}</button><span class="eq">${eqText()}</span></div>`;
 if(st<4&&cur>=0){
  const p=P[cur];
  if(cur===me||S.isHost){
   const b=bounds(),tc=S.currentBet-p.bet,cc=tc<=0,key=[cur,st,S.currentBet,S.hand].join('-');
   if(rk!==key){rk=key;rt=b.min;err=''}
   rt=Math.max(b.min,Math.min(rt,b.max));
   const can=b.max>S.currentBet;
   h+=`<div class="panel"><div class="mute" style="margin-bottom:6px"><b style="color:var(--text)">${cur===me?'Your turn':'Host controls · '+esc(p.name)}</b> · ${cc?'nothing to call':'to call '+Math.min(tc,p.chips)}</div>
   <div class="bar"><button class="btn fold" onclick="act('fold')">Fold</button><button class="btn call" onclick="act('${cc?'check':'call'}')">${cc?'Check':'Call '+Math.min(tc,p.chips)}</button>
   ${can?`<div class="sld"><button class="sm" onclick="sl(rt-${S.cfg.bb})">−</button><input type="range" id="rg" min="${b.min}" max="${b.max}" value="${rt}" oninput="sl(this.value)"><button class="sm" onclick="sl(rt+${S.cfg.bb})">+</button><input type="number" class="amt" id="rtv" value="${rt}" min="${b.min}" max="${b.max}" inputmode="numeric" onchange="sl(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();sl(this.value);act('raise',{amount:rt})}"></div>
   <button class="btn raise" id="rb" data-l="${S.currentBet?'Raise to':'Bet'}" onclick="sl($('#rtv').value);act('raise',{amount:rt})">${S.currentBet?'Raise to':'Bet'} ${rt}</button>`:''}
   <button class="btn all" onclick="act('allin')">All In</button></div>
   ${can?`<div class="chips">${[5,10,25,100,500].map(v=>`<button class="chip c${v}" onclick="addChip(${v})">${v}</button>`).join('')}<button class="sm" onclick="quick('min')">Min</button><button class="sm" onclick="quick('half')">½ pot</button><button class="sm" onclick="quick('pot')">Pot</button></div>`:''}${errH()}</div>`;
  }else h+=`<div class="wait">Waiting for ${esc(p.name)}…${S.isHost?` <button class="sm" onclick="act('fold')">Fold for them</button>`:''}</div>`;
 }
 if(st===4){
  h+=`<div class="card"><b>Showdown</b><div class="mute">${S.isHost?'Tap the winner of each pot. Tap several to split.':'The host is picking the winners.'}</div></div>`;
  const sc=P.map(p=>p.hole&&p.hole.length===2&&!p.folded&&B.length===5?best(p.hole.concat(B).map(parse)):null);
  h+=showEq();
  h+=S.pots.map((pt,k)=>`<div class="card"><b>${S.pots.length>1?(k?'Side pot '+k:'Main pot'):'Pot'}: ${pt.amt}</b><div>${pt.elig.map(i=>`<button class="pick ${pt.win.includes(i)?'on':''}" ${S.isHost?`onclick="act('win',{k:${k},i:${i}})"`:'disabled'}>${sc[i]&&sc[i]===Math.max(...pt.elig.map(j=>sc[j]||0))?'🏆 ':''}${esc(P[i].name)}${sc[i]?' · '+HN(sc[i]):''}</button>`).join('')}</div></div>`).join('')+errH();
  if(S.isHost)h+=`<button class="btn go" ${S.pots.every(p=>p.win.length)?'':'disabled'} onclick="act('award')">Award pots</button>`;
 }
 if(st===5){
  h+=`<div class="card"><b>Result</b>${S.result.map(r=>`<div>${esc(r)}</div>`).join('')}</div>`;
  if(S.isHost)h+=`<div class="card"><b>Players</b> <span class="mute">Reorder seats, add chips or remove someone between hands.</span>${P.map((p,i)=>`<div class="st"><span>${esc(p.name)} · ${p.chips}</span>${ctl(i,true)}</div>`).join('')}</div>${errH()}<button class="btn go" onclick="act('next')">Next hand</button>`;
  else h+='<p class="wait">Waiting for the host to deal the next hand…</p>';
 }
 return h;
}
const RANKS=['A','K','Q','J','10','9','8','7','6','5','4','3','2'],RV={A:14,K:13,Q:12,J:11,'10':10},ALL=[];
for(let i=2;i<=9;i++)RV[i]=i;
for(const s of 'SHDC')for(const r of RANKS)ALL.push(r+s);
const parse=c=>({r:RV[c.slice(0,-1)],s:c.slice(-1)}),CB={};
const combos=n=>CB[n]||(CB[n]=(()=>{const o=[];for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)for(let c=b+1;c<n;c++)for(let d=c+1;d<n;d++)for(let e=d+1;e<n;e++)o.push([a,b,c,d,e]);return o})());
function score5(c){
 const rs=c.map(x=>x.r).sort((a,b)=>b-a),fl=c.every(x=>x.s===c[0].s);
 let st=0;if(new Set(rs).size===5){if(rs[0]-rs[4]===4)st=rs[0];else if(rs[0]===14&&rs[1]===5)st=5}
 const cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);
 const g=Object.keys(cnt).map(r=>[cnt[r],+r]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]),k=g.map(x=>x[1]);
 const cat=st&&fl?8:g[0][0]===4?7:g[0][0]===3&&g[1][0]===2?6:fl?5:st?4:g[0][0]===3?3:g[0][0]===2&&g[1][0]===2?2:g[0][0]===2?1:0;
 return cat*1e10+(st?[st]:k).reduce((a,x,i)=>a+x*Math.pow(15,4-i),0);
}
const best=cs=>{let m=0;for(const c of combos(cs.length)){const v=score5(c.map(i=>cs[i]));if(v>m)m=v}return m};
const HNM=['High card','Pair','Two pair','Three of a kind','Straight','Flush','Full house','Four of a kind','Straight flush'];
const HN=v=>v>=8e10&&v%1e10===708750?'Royal flush':HNM[Math.floor(v/1e10)];
function equity(hands,board,unk,iters){
 const used=new Set(hands.flat().concat(board)),deck=ALL.filter(c=>!used.has(c)),need=5-board.length;
 if(!need&&!unk)iters=1;
 const bs=board.map(parse),hs=hands.map(h=>h.map(parse)),W=hands.map(()=>0),T=hands.map(()=>0);
 for(let it=0;it<iters;it++){
  const k=need+2*unk;
  for(let i=0;i<k;i++){const j=i+Math.floor(Math.random()*(deck.length-i)),t=deck[i];deck[i]=deck[j];deck[j]=t}
  const bd=bs.concat(deck.slice(0,need).map(parse)),sc=hs.map(h=>best(h.concat(bd))),all=sc.slice();
  for(let u=0;u<unk;u++)all.push(best([parse(deck[need+2*u]),parse(deck[need+2*u+1])].concat(bd)));
  const mx=Math.max(...all),nw=all.filter(s=>s===mx).length;
  sc.forEach((s,i)=>{if(s===mx){if(nw===1)W[i]++;else T[i]++}});
 }
 return W.map((w,i)=>({win:w/iters*100,tie:T[i]/iters*100}));
}
let EQ={};
function eqText(){
 const P=S.players,B=S.board||[],m=P[S.me];
 if(!m.hole||m.hole.length!==2||m.folded)return '';
 const unk=P.filter(p=>!p.folded&&!p.out).length-1;
 if(unk<1)return '';
 const key=m.hole.join()+'|'+B.join()+'|'+unk;
 const fmt=()=>`Win ${EQ.r.win.toFixed(0)}% · Tie ${EQ.r.tie.toFixed(0)}% <span class="mute">vs ${unk} random hand${unk>1?'s':''}</span>`;
 if(EQ.key===key)return fmt();
 setTimeout(()=>{if(EQ.key!==key)EQ={key,r:equity([m.hole],B,unk,unk>4?800:1500)[0]};const e=$('.eq');if(e)e.innerHTML=fmt()},20);
 return '<span class="mute">calculating…</span>';
}
function showEq(){
 const B=S.board||[],live=S.players.filter(p=>!p.folded&&!p.out),rev=live.filter(p=>p.hole&&p.hole.length===2);
 if(rev.length<2||B.length>=5)return '';
 const unk=live.length-rev.length,key='S'+rev.map(p=>p.hole.join('')).join()+'|'+B.join()+'|'+unk;
 if(EQ.key!==key)EQ={key,r:equity(rev.map(p=>p.hole),B,unk,1500)};
 return `<div class="card"><b>Chances to win</b>${rev.map((p,k)=>`<div class="st"><span>${esc(p.name)}</span><span><b>${EQ.r[k].win.toFixed(0)}%</b> <span class="mute">tie ${EQ.r[k].tie.toFixed(0)}%</span></span></div>`).join('')}</div>`;
}
let CP=null;
function openCP(mode){CP={mode,sel:[...(mode==='hole'?(S.players[S.me].hole||[]):(S.board||[]))]};drawCP();$('#cp').hidden=false}
function drawCP(){
 const max=CP.mode==='hole'?2:5,blocked=new Set(CP.mode==='hole'?(S.board||[]):(S.players[S.me].hole||[]));
 $('#cp').innerHTML=`<div class="rk"><div class="top"><b>${CP.mode==='hole'?'Your two cards (only you see them)':'Community cards'}</b><button class="sm" onclick="closeCP()">✕</button></div><div class="mute">Tap the cards you really got. ${CP.sel.length}/${max} selected.</div><div class="cpg">${['S','H','D','C'].map(s=>RANKS.map(r=>{const c=r+s,on=CP.sel.includes(c);return `<button class="cpc ${'HD'.includes(s)?'red':''} ${on?'on':''}" ${blocked.has(c)||(!on&&CP.sel.length>=max)?'disabled':''} onclick="cpTap('${c}')">${r}<br>${SU[s]}</button>`}).join('')).join('')}</div><div class="ctl"><button class="sm" onclick="CP.sel=[];drawCP()">Clear</button><button class="btn go" style="margin:0" onclick="cpDone()">Done</button></div></div>`;
}
const closeCP=()=>{$('#cp').hidden=true};
const cpTap=c=>{const i=CP.sel.indexOf(c);i<0?CP.sel.push(c):CP.sel.splice(i,1);drawCP()};
const cpDone=async()=>{await act(CP.mode,{cards:CP.sel});closeCP()};
function sl(v){const b=bounds();rt=Math.max(b.min,Math.min(+v||0,b.max));const e=$('#rb'),a=$('#rtv'),r=$('#rg');if(e)e.textContent=e.dataset.l+' '+rt;if(a)a.value=rt;if(r)r.value=rt}

addEventListener('resize',()=>{const w=innerWidth>640;if(w!==wasWide){wasWide=w;if(S&&S.started)render()}});

 const s=[...S.players].sort((a,b)=>b.chips-a.chips);
 return `<h1>Final standings</h1><p class="mute">${S.hand} hands played.</p><div class="card">${s.map((p,i)=>{const d=p.chips-p.buy;return `<div class="st"><span>${i+1}. ${esc(p.name)}${i===0?' 👑':''}</span><span><b>${p.chips}</b> <span class="mute">(${d>=0?'+':''}${d})</span></span></div>`}).join('')}</div>
 ${S.isHost?`<button class="btn go" onclick="act('resume')">Keep playing</button><button class="btn go alt" onclick="act('close')">Close room</button>`:''}<button class="btn go alt" onclick="leave()">Leave</button>`;
}
setInterval(()=>{const e=$('#clock');if(e&&S&&S.started)e.textContent=clk()},1000);
fetch('/info').then(r=>r.json()).then(i=>{JOINURL=i.ips.map(ip=>'http://'+ip+':'+i.port).join(' or ');if(S&&!S.started)render()}).catch(()=>{});
